version: 2

project_name: thermalik-bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: thermalik-bridge
    dir: Bridge
    binary: thermalik-bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X thermalik-bridge/internal/version.Version={{.Version}}
      - -X thermalik-bridge/internal/version.Commit={{.Commit}}
      - -X thermalik-bridge/internal/version.Date={{.Date}}

archives:
  - id: thermalik-bridge
    ids: [thermalik-bridge]
    formats: [tar.gz]
    name_template: "thermalik-bridge_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: Bridge/configs/bridge.example.json
        dst: bridge.example.json
      - src: Bridge/README.md
        dst: README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: saefy
    name: TicketJS
  name_template: "thermalik-bridge {{.Tag}}"
  header: |
    ## thermalik-bridge {{ .Tag }}

    Local companion service for thermal printer communication.

    ### Installation

    **macOS / Linux:**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/saefy/TicketJS/main/Bridge/install-bridge.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    iwr https://raw.githubusercontent.com/saefy/TicketJS/main/Bridge/install-bridge.ps1 -useb | iex
    ```

    After installation run `thermalik-bridge setup` to configure your printers.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
